<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donate - DonateConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            DonateConnect
        </a>

        <a href="index.html" class="text-white">
            Home
        </a>

    </div>

</nav>


<section class="py-5 bg-light">

    <div class="container">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Make a Donation
            </h1>

            <p class="text-muted">
                Your contribution can help someone near you.
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <form>

                            <label class="form-label">
                                Your Name
                            </label>

                            <input type="text"
                                   class="form-control mb-3"
                                   placeholder="Enter your name">


                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control mb-3"
                                   placeholder="Enter your email">


                            <label class="form-label">
                                Your Location
                            </label>

                            <input type="text"
                                   class="form-control mb-3"
                                   placeholder="City / Area">


                            <label class="form-label">
                                Donation Type
                            </label>

                            <select class="form-select mb-3">

                                <option>Select Donation</option>

                                <option>Money</option>

                                <option>Food</option>

                                <option>Clothes</option>

                                <option>Books</option>

                                <option>Medicines</option>

                                <option>Other</option>

                            </select>


                            <label class="form-label">
                                Donation Amount
                            </label>

                            <input type="number"
                                   class="form-control mb-3"
                                   placeholder="₹ Enter amount">


                            <label class="form-label">
                                Purpose
                            </label>

                            <textarea class="form-control mb-3"
                                      rows="4"
                                      placeholder="What would you like your donation to support?"></textarea>


                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Continue Donation
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="bg-dark text-white text-center py-4">

    <p>
        Created by <strong>Shivam & Divayansh</strong>
    </p>

</footer>


</body>
</html>
